<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="theme-color" content="#2b63d9">
<meta name="format-detection" content="telephone=no">
<title>订单一键拨号</title>
<!-- jsQR 已打包进 APK，断网可用；万一缺失再从 CDN 补 -->
<script src="jsqr.min.js"></script>
<script>
if (typeof jsQR === "undefined") {
    var _s = document.createElement("script");
    _s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    document.head.appendChild(_s);
}
</script>
<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
    body{padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:#f4f5f7;font-size:14px;-webkit-tap-highlight-color:transparent}
    .box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
    h3{font-size:15px;margin-bottom:4px}
    .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
    textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;min-height:130px;margin:8px 0;font-family:ui-monospace,Menlo,monospace;resize:vertical}
    input,select{padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
    button{padding:11px 14px;background:#2b63d9;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;min-height:44px}
    button:active{opacity:.85}
    .btn-gray{background:#777}
    .btn-del{background:#e63946}
    .btn-ghost{background:#eef2ff;color:#2b63d9;border:1px solid #c7dbfa}
    .tag-btn{padding:6px 8px;font-size:12px;background:#e8f0fe;color:#2b63d9;border:1px solid #c7dbfa;border-radius:6px;margin:3px;cursor:pointer;min-height:auto}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;border-radius:10px;border:1px solid #eee}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
    th,td{border-bottom:1px solid #eee;border-right:1px solid #eee;padding:9px 6px;text-align:center;white-space:nowrap}
    th{background:#f8f8f8;font-size:12px;color:#555}
    td input[type="text"]{width:100%;padding:6px;border:1px solid #e2e2e2;border-radius:6px;font-size:13px}
    .phone{color:#2b63d9;text-decoration:none;font-weight:700}
    #scanModal{display:none;position:fixed;inset:0;background:#000;z-index:99}
    #scanModal video{width:100%;height:100%;object-fit:cover}
    .close-scan{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#e63946;color:#fff;padding:10px 14px;border-radius:10px;border:none;font-size:15px;z-index:100}
    .scan-tip{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;color:#fff;font-size:13px;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px;z-index:100}
    .tip{color:#666;margin:6px 0;font-size:12px;line-height:1.5}
    #canvas{display:none}
    .stat{font-size:13px;color:#333}
</style>
</head>
<body>
<div class="box">
    <h3>📝 粘贴订单文本</h3>
    <textarea id="txtInput" placeholder="直接粘贴：
6917808933767753079	15784653986,5187
6956009284822177538	15781076306,7527
或者点扫码读取二维码里面的订单"></textarea>
    <div class="row">
        <button id="btnParse">✅ 解析加载订单</button>
        <button id="btnScan">📷 扫码录入</button>
        <button id="btnPhoto" class="btn-ghost">🖼️ 拍照识别</button>
    </div>
    <div class="row">
        <button id="btnExport" class="btn-gray">导出备份 CSV</button>
        <button id="btnClear" class="btn-del">清空全部数据</button>
    </div>
    <p class="tip">一行一条订单，订单号和手机号之间用空格/Tab 隔开；重复订单号会自动跳过。</p>
</div>

<div class="box">
    <div class="row">
        <input id="searchInput" placeholder="输入订单号搜索" style="flex:1;min-width:150px">
        <select id="filterStatus">
            <option value="all">全部</option>
            <option value="ok">已拨打</option>
            <option value="no">未拨打</option>
        </select>
        <button id="btnSearch">搜索</button>
        <button id="btnReset" class="btn-gray">重置</button>
    </div>
</div>

<div class="box">
    <div id="stat" class="stat">总数：0｜已拨打：0｜未拨打：0</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>订单号</th>
                    <th>手机号</th>
                    <th>拨打</th>
                    <th>拨打时间</th>
                    <th>快捷备注</th>
                    <th>备注内容</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="scanModal">
    <span class="scan-tip">对准二维码</span>
    <button class="close-scan" id="btnCloseScan">关闭 ✕</button>
    <video id="scanVideo" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>

<script>
/* ================= 数据库 ================= */
const DB_NAME = "CallOrderDB";
const STORE = "orders";
let db = null;

function initDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(STORE)) {
                const os = d.createObjectStore(STORE, { keyPath: "id" });
                os.createIndex("status", "status");
                os.createIndex("orderId", "orderId");
            }
        };
        req.onsuccess = e => { db = e.target.result; resolve(db); };
        req.onerror = e => reject(e);
    });
}
function txDone(tx) {
    return new Promise((res, rej) => {
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error);
    });
}
function getAllItems() {
    return new Promise(resolve => {
        const tx = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
    });
}
function saveItem(item) {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(item);
    return txDone(tx);
}
function deleteItem(id) {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    return txDone(tx);
}
function clearStore() {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).clear();
    return txDone(tx);
}
function uid() {
    return "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ================= 导入 ================= */
function splitLines(text) {
    return String(text || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
}

/** 把一段文本导入：自动跳过重复订单号 */
async function importText(text) {
    const existing = new Set((await getAllItems()).map(i => String(i.orderId)));
    const lines = splitLines(text);
    const batch = [];
    let added = 0, dup = 0, bad = 0;

    for (const line of lines) {
        const parts = line.split(/[\t\s]+/).filter(Boolean);
        if (parts.length < 2) { bad++; continue; }
        const orderId = parts[0];
        const phone = parts[1];
        if (!orderId || !phone) { bad++; continue; }
        if (existing.has(orderId)) { dup++; continue; }
        existing.add(orderId);
        batch.push({
            id: uid(), orderId, phone,
            status: "no", callTime: "", remark: "", createdAt: Date.now()
        });
        added++;
    }
    if (batch.length) {
        const tx = db.transaction(STORE, "readwrite");
        const os = tx.objectStore(STORE);
        batch.forEach(it => os.put(it));
        await txDone(tx);
    }
    return { added: added, dup: dup, bad: bad };
}

function importMessage(r) {
    let s = "新增 " + r.added + " 条";
    if (r.dup) s += "，跳过重复 " + r.dup + " 条";
    if (r.bad) s += "，格式不对 " + r.bad + " 行";
    return s;
}

/* ================= 列表渲染 ================= */
function makeCell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
}

async function renderList() {
    if (!db) return;
    const all = await getAllItems();
    all.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

    const searchKey = document.getElementById("searchInput").value.trim();
    const filterVal = document.getElementById("filterStatus").value;

    let list = all;
    if (searchKey) list = list.filter(i => String(i.orderId).includes(searchKey) || String(i.phone).includes(searchKey));
    if (filterVal !== "all") list = list.filter(i => i.status === filterVal);

    const okNum = all.filter(i => i.status === "ok").length;
    document.getElementById("stat").textContent =
        "总数：" + all.length + "｜已拨打：" + okNum + "｜未拨打：" + (all.length - okNum) +
        (list.length !== all.length ? "｜当前显示：" + list.length : "");

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    if (!list.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 8;
        td.style.color = "#999";
        td.style.padding = "18px";
        td.textContent = all.length ? "没有符合条件的记录" : "暂无数据，先粘贴订单或扫码";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
    }

    list.forEach((item, idx) => {
        const tr = document.createElement("tr");
        tr.appendChild(makeCell(idx + 1));
        tr.appendChild(makeCell(item.orderId));

        const tdPhone = document.createElement("td");
        const a = document.createElement("a");
        a.className = "phone";
        a.textContent = item.phone;
        a.href = "tel:" + String(item.phone).replace(/[^0-9+,;*#pPwW]/g, "");
        a.addEventListener("click", () => { markCall(item.id); });
        tdPhone.appendChild(a);
        tr.appendChild(tdPhone);

        const tdChk = document.createElement("td");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = item.status === "ok";
        cb.style.width = "22px";
        cb.style.height = "22px";
        cb.addEventListener("change", () => toggleStatus(item.id));
        tdChk.appendChild(cb);
        tr.appendChild(tdChk);

        tr.appendChild(makeCell(item.callTime || ""));

        const tdTag = document.createElement("td");
        ["无人接听", "忙音", "空号"].forEach(txt => {
            const b = document.createElement("button");
            b.className = "tag-btn";
            b.type = "button";
            b.textContent = txt;
            b.addEventListener("click", () => setRemark(item.id, txt));
            tdTag.appendChild(b);
        });
        tr.appendChild(tdTag);

        const tdRemark = document.createElement("td");
        const inp = document.createElement("input");
        inp.type = "text";
        inp.value = item.remark || "";
        inp.placeholder = "备注";
        let timer = null;
        inp.addEventListener("input", () => {
            const v = inp.value;
            clearTimeout(timer);
            timer = setTimeout(() => saveRemark(item.id, v), 500);
        });
        tdRemark.appendChild(inp);
        tr.appendChild(tdRemark);

        const tdOp = document.createElement("td");
        const del = document.createElement("button");
        del.className = "btn-del";
        del.style.padding = "6px 10px";
        del.style.fontSize = "12px";
        del.type = "button";
        del.textContent = "删除";
        del.addEventListener("click", () => removeItem(item.id));
        tdOp.appendChild(del);
        tr.appendChild(tdOp);

        tbody.appendChild(tr);
    });
}

async function findItem(id) {
    const all = await getAllItems();
    return all.find(x => x.id === id) || null;
}

async function markCall(id) {
    const one = await findItem(id);
    if (!one || one.status === "ok") return;
    one.status = "ok";
    one.callTime = new Date().toLocaleString();
    await saveItem(one);
    renderList();
}

async function toggleStatus(id) {
    const one = await findItem(id);
    if (!one) return;
    if (one.status === "ok") {
        one.status = "no";
        one.callTime = "";
    } else {
        one.status = "ok";
        one.callTime = new Date().toLocaleString();
    }
    await saveItem(one);
    renderList();
}

async function setRemark(id, txt) {
    const one = await findItem(id);
    if (!one) return;
    one.remark = txt;
    await saveItem(one);
    renderList();
}

async function saveRemark(id, txt) {
    const one = await findItem(id);
    if (!one || one.remark === txt) return;
    one.remark = txt;
    await saveItem(one);
}

async function removeItem(id) {
    if (!confirm("确定删除这条订单？")) return;
    await deleteItem(id);
    renderList();
}

/* ================= 导出 / 清空 ================= */
function csvCell(v) {
    return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
}

async function exportCsv() {
    const all = await getAllItems();
    if (!all.length) { alert("还没有数据可以导出"); return; }
    all.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    let csv = "\uFEFF" + ["订单号", "手机号", "拨打状态", "拨打时间", "备注"].map(csvCell).join(",") + "\r\n";
    all.forEach(i => {
        csv += [i.orderId, i.phone, i.status === "ok" ? "已拨打" : "未拨打", i.callTime, i.remark]
            .map(csvCell).join(",") + "\r\n";
    });
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    a.href = url;
    a.download = "订单拨打记录_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function clearAll() {
    const all = await getAllItems();
    if (!all.length) { alert("当前没有数据"); return; }
    if (!confirm("确定清空全部 " + all.length + " 条数据？建议先导出备份。")) return;
    await clearStore();
    renderList();
}

/* ================= 扫码（实时） ================= */
let scanActive = false;
let stream = null;

async function openScan() {
    if (typeof jsQR === "undefined") {
        alert("二维码库还没加载好，请稍后重试，或用「拍照识别」");
        return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("当前环境不能调用摄像头，请用「拍照识别」");
        return;
    }
    const video = document.getElementById("scanVideo");
    document.getElementById("scanModal").style.display = "block";
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
        });
        video.srcObject = stream;
        await video.play();
        scanActive = true;
        requestAnimationFrame(tick);
    } catch (e) {
        closeScan();
        alert("打开摄像头失败：" + (e && e.message ? e.message : e) + "\n可以改用「拍照识别」");
    }
}

function tick() {
    if (!scanActive) return;
    const video = document.getElementById("scanVideo");
    const canvas = document.getElementById("canvas");
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code && code.data) {
            const text = code.data;
            closeScan();
            handleScanText(text);
            return;
        }
    }
    requestAnimationFrame(tick);
}

async function closeScan() {
    scanActive = false;
    const video = document.getElementById("scanVideo");
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    video.srcObject = null;
    document.getElementById("scanModal").style.display = "none";
}

async function handleScanText(text) {
    try {
        const r = await importText(text);
        await renderList();
        if (r.added === 0 && r.dup > 0) alert("这个二维码里的订单已经导入过了");
        else alert("扫码导入：" + importMessage(r));
    } catch (e) {
        alert("导入出错：" + e.message);
    }
}

/* ================= 拍照识别（不依赖实时摄像头） ================= */
async function decodeImageFile(file) {
    if (!file) return;
    if (typeof jsQR === "undefined") { alert("二维码库还没加载好，请稍后重试"); return; }
    const url = URL.createObjectURL(file);
    try {
        const img = new Image();
        await new Promise((res, rej) => {
            img.onload = res;
            img.onerror = rej;
            img.src = url;
        });
        // 大图先缩到 1600 以内，解码更快
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, cv.width, cv.height);

        let code = jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
        if (!code) {
            // 再试放大 1.5 倍（二维码太小时有效）
            const cv2 = document.createElement("canvas");
            cv2.width = Math.round(cv.width * 1.5);
            cv2.height = Math.round(cv.height * 1.5);
            const ctx2 = cv2.getContext("2d", { willReadFrequently: true });
            ctx2.drawImage(cv, 0, 0, cv2.width, cv2.height);
            code = jsQR(ctx2.getImageData(0, 0, cv2.width, cv2.height).data, cv2.width, cv2.height);
        }
        if (!code || !code.data) {
            alert("这张图里没认出二维码。靠近一点、对准、别反光再拍一张。");
            return;
        }
        await handleScanText(code.data);
    } catch (e) {
        alert("识别失败：" + e.message);
    } finally {
        URL.revokeObjectURL(url);
    }
}

/* ================= 事件 ================= */
document.getElementById("btnParse").addEventListener("click", async () => {
    const text = document.getElementById("txtInput").value;
    if (!text.trim()) { alert("请粘贴订单内容"); return; }
    try {
        const r = await importText(text);
        document.getElementById("txtInput").value = "";
        await renderList();
        alert("解析完成：" + importMessage(r));
    } catch (e) {
        alert("导入失败：" + e.message);
    }
});

document.getElementById("btnScan").addEventListener("click", openScan);
document.getElementById("btnPhoto").addEventListener("click", () => {
    document.getElementById("photoInput").click();
});
document.getElementById("btnCloseScan").addEventListener("click", closeScan);
document.getElementById("photoInput").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    decodeImageFile(f);
});
document.getElementById("galleryInput").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    decodeImageFile(f);
});
document.getElementById("btnExport").addEventListener("click", exportCsv);
document.getElementById("btnClear").addEventListener("click", clearAll);
document.getElementById("btnSearch").addEventListener("click", renderList);
document.getElementById("btnReset").addEventListener("click", () => {
    document.getElementById("searchInput").value = "";
    document.getElementById("filterStatus").value = "all";
    renderList();
});
document.getElementById("searchInput").addEventListener("input", renderList);
document.getElementById("filterStatus").addEventListener("change", renderList);

/* ================= 启动 ================= */
(async function () {
    try {
        await initDB();
        await renderList();
    } catch (e) {
        alert("数据库打开失败：" + e.message);
    }
})();
</script>
</body>
</html>
